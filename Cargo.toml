[workspace]
resolver = "2"
members = [
    "crates/afterburner",
    "crates/afterburner-core",
    "crates/afterburner-wasi",
    "crates/afterburner-ignite",
    "crates/afterburner-flow",
    "crates/afterburner-adaptive",
    "crates/afterburner-node-compat",
    "crates/afterburner-plugin",
    "crates/afterburner-thrust",
    "crates/afterburner-afb",
    "crates/afterburner-cloud",
]
# `afterburner-plugin` targets `wasm32-wasip1`. Building it on the host
# triple fails because `javy-plugin-api` assumes a WASI environment.
# Keep it out of `cargo build --workspace` by trimming default-members;
# the plugin is built explicitly via `afterburner-plugin/build.sh`.
default-members = [
    "crates/afterburner",
    "crates/afterburner-core",
    "crates/afterburner-wasi",
    "crates/afterburner-ignite",
    "crates/afterburner-flow",
    "crates/afterburner-adaptive",
    "crates/afterburner-node-compat",
    "crates/afterburner-thrust",
    "crates/afterburner-afb",
    "crates/afterburner-cloud",
]

# `examples/*` are standalone Cargo projects (each with its own
# [workspace] root). Exclude the directory defensively in case a
# user drops a new example without the stanza.
exclude = ["examples"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
authors = ["Theo Bulut <info@afterburner.sh>"]
# Engine crates are source-available under BSL 1.1 (each version converts to
# Apache-2.0 four years after its release). Apache-2.0 crates (afterburner-afb,
# burndb, burn/*) set `license = "Apache-2.0"` explicitly in their [package].
license = "BUSL-1.1"
repository = "https://github.com/afterburner-sh/afterburner"
homepage = "https://github.com/afterburner-sh/afterburner"
documentation = "https://docs.rs/afterburner"
# Every crate publishes with the top-level README (workspace-inherited;
# cargo resolves this relative to the workspace root and bundles it).
readme = "README.md"
keywords = ["javascript", "wasm", "sandbox", "runtime"]
categories = ["wasm", "development-tools"]

[workspace.dependencies]
afterburner = { version = "0.1.2", path = "crates/afterburner" }
afterburner-core = { version = "0.1.2", path = "crates/afterburner-core" }
afterburner-wasi = { version = "0.1.2", path = "crates/afterburner-wasi" }
afterburner-ignite = { version = "0.1.2", path = "crates/afterburner-ignite" }
afterburner-flow = { version = "0.1.2", path = "crates/afterburner-flow" }
afterburner-adaptive = { version = "0.1.2", path = "crates/afterburner-adaptive" }
afterburner-node-compat = { version = "0.1.2", path = "crates/afterburner-node-compat" }
afterburner-thrust = { version = "0.1.2", path = "crates/afterburner-thrust" }
afterburner-afb = { version = "0.1.2", path = "crates/afterburner-afb" }
afterburner-cloud = { version = "0.1.2", path = "crates/afterburner-cloud" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# `.afb` package format (afterburner-afb). zstd is built without default
# features (no legacy-frame decode, no zdict builder, no compression
# threads) — one trimmed build shared by afb packing and the node-compat
# zlib shadow; decode memory is bounded at runtime via window_log_max, not
# by the dependency. dirs/secrecy/zeroize/httpmock are reserved here for
# the forthcoming afterburner-cloud client crate.
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
toml = "0.8"
semver = { version = "1", features = ["serde"] }
pubgrub = "0.4"
dirs = "5"
secrecy = "0.10"
zeroize = "1"
httpmock = "0.7"
sha1 = { version = "0.10", features = ["oid"] }
thiserror = "2"
hmac = "0.12"
md-5 = "0.10"
getrandom = "0.2"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
pbkdf2 = "0.12"
scrypt = "0.11"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ctr = "0.9"
aes-kw = "0.2"
sha3 = "0.10"
num-bigint-dig = { version = "0.8", features = ["prime"] }
num-traits = "0.2"
num-integer = "0.1"
spki = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
tempfile = "3"
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
kovan-map = "0.1.14"
kovan-channel = "0.1.14"
libc = "0.2"
# Colored + animated `burn` CLI output (brand palette spinners/styling). Used
# only by the `bin` feature.
crossterm = "0.28"
# Arrow-key Select/MultiSelect menus for interactive CLI pickers. Used only
# by the `bin` feature; default features off so it pulls just the core
# prompt rendering (no editor/fuzzy/history extras).
dialoguer = { version = "0.11", default-features = false }

wasmtime = { version = "44", features = ["cranelift", "cache"] }
wasmtime-wasi = "44"
anyhow = "1"

# B2 daemon-mode HTTP server plumbing. axum/tokio/hyper are only
# pulled by `afterburner-wasi/daemon` (off by default) and the `burn`
# CLI — library consumers who don't run `http.createServer().listen()`
# don't pay the compile-time or binary-size cost.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "signal", "sync"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

# B7 tls — `tls.connect` / `tls.createServer`, gated the same way as
# the daemon HTTP plumbing above. `webpki-roots` ships the Mozilla
# root CA bundle so client connects work without filesystem access.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
# time 0.3.48 breaks trait coherence for any crate with a blanket
# `impl<T: Into<String>> From<T>` (E0119 in rcgen 0.13 AND 0.14). The lock
# pins time to 0.3.47 (`cargo update -p time --precise 0.3.47`); if a plain
# `cargo update` ever pulls 0.3.48+ and rcgen starts failing to compile,
# re-pin (and retest on each new time/rcgen release - drop the pin once
# they are coherent again).
rcgen = "0.14"

# HTTP/3 stack — quinn is the pure-Rust QUIC transport (rustls under
# the hood for TLS 1.3); h3 is the HTTP/3 protocol layer; h3-quinn
# stitches them together. Gated behind the `http3` feature so
# library consumers without an HTTP/3 server don't pay the
# compile cost.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# L3 shadow for `sqlite3`. `bundled` compiles the SQLite C
# amalgamation at build time and links it statically into the burn
# binary — no runtime dependency on `libsqlite3.so`. The Rust crate
# itself is the only public surface; the C is encapsulated. Gated
# behind `shadow-sqlite3` so non-SQLite builds don't compile the
# amalgamation (~2 MB compile-time cost).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# L3 shadow for `sharp`. Both crates are 100% pure Rust:
#   * `image` — codec layer (PNG, JPEG, WebP, GIF, BMP, TIFF)
#   * `fast_image_resize` — SIMD-accelerated resampling (much
#     faster than image's built-in `imageops::resize`)
# Gated behind `shadow-sharp` so non-image builds don't pull these
# in (~2 MB of compiled deps).
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "gif", "bmp",
] }
fast_image_resize = { version = "6", features = ["image"] }

# B7 dns — `hickory-resolver` (formerly trust-dns-resolver) is the
# canonical pure-Rust async DNS resolver. We use it synchronously
# from a worker thread so the host-import boundary stays sync (the
# plugin can't host-call from inside an async stack — it's running
# inside Wasmtime). Default features pull in tokio + ring; we keep
# them off and use the resolver's `Resolver` (sync) entry points.
hickory-resolver = { version = "0.24", default-features = false, features = [
    "tokio-runtime", "system-config",
] }

# `socket2` is the canonical low-level socket-options crate; we use
# its `SockRef::from(&tokio::net::TcpStream)` to actually toggle
# TCP_NODELAY / SO_KEEPALIVE on a tokio-owned socket without
# detaching the stream. tokio itself exposes set_nodelay but no
# keepalive knob, hence this dep. Gated behind `daemon` since net /
# tls are the only callers.
socket2 = { version = "0.5", features = ["all"] }
# Cross-platform shared memory + futex. memmap2 wraps mmap/CreateFileMapping;
# atomic-wait wraps futex (Linux) / __ulock (macOS) / WaitOnAddress (Windows).
# Used by SharedArrayBuffer + Atomics.wait/notify across worker subprocesses.
memmap2 = "0.9"
atomic-wait = "1"

rquickjs = { version = "0.11", features = ["bindgen"] }

fastrace = { version = "0.7", features = ["enable"] }

javy-plugin-api = "6.0"

# `burn` CLI surface (the `bin`/`release-cli` features only).
clap = { version = "4", features = ["derive"] }
rustyline = "14"
# Pinned exact: oxc's API churns between minors; bumps are deliberate.
oxc = { version = "=0.127.0", default-features = false, features = [
    "transformer", "codegen", "semantic", "ast_visit",
] }

# node-compat optional password-hashing / JWT shadows (feature-gated).
bcrypt = "0.17"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }

# dev-dependencies shared across crates — single source of truth too.
rand = "0.8"
wat = "1"
http = "1"
serial_test = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
incremental = false
overflow-checks = false

[profile.bench]
inherits = "release"

# Tightest possible CLI profile. Used by `cargo build --profile=cli-release`
# for shipping the `burn` binary — maxes every optimization knob:
#   * opt-level = 3 + LTO fat: aggressive cross-crate inlining
#   * codegen-units = 1: single TU per crate, lets the optimizer see
#     everything in one pass at link time
#   * panic = "abort": drops the unwind tables (~5% binary size,
#     small perf win on hot paths that otherwise emit landing pads)
#   * strip = "symbols": removes debug symbols + symbol table from
#     the final ELF/Mach-O
#   * overflow-checks = false: integer overflow checks compile out
#     (release default; explicit so future-us doesn't accidentally
#     re-enable them through `[profile.release.package.<crate>]`)
[profile.cli-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
incremental = false
overflow-checks = false

# `wasm-release` profile is what `afterburner-plugin/build.sh` uses
# when re-Wizer-preinitializing the QuickJS plugin. We want a small
# wasm32-wasip1 binary (every byte ships with the Rust binary via
# include_bytes!) so size beats raw speed at the codegen-unit knob.
[profile.wasm-release]
inherits = "release"
opt-level = "z"   # size-first
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

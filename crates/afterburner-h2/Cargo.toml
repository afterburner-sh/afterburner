[package]
name = "afterburner-h2"
version.workspace = true
# Upstream's edition: the derived sources are not ported to 2024.
edition = "2021"
rust-version.workspace = true
authors.workspace = true
# MIT, NOT the workspace BSL: this crate is derived from h2 0.4.20
# (see NOTICE and LICENSE).
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "HTTP/2 over futures-io for Afterburner on nuclei, derived from h2"
keywords = ["http", "async", "non-blocking", "nuclei"]
categories = ["asynchronous", "network-programming", "web-programming::http-client", "web-programming::http-server"]
include = ["src/**/*", "LICENSE", "NOTICE", "Cargo.toml"]

[features]
stream = []
unstable = []

[lib]
name = "h2"

[dependencies]
atomic-waker = "1.0.0"
bytes = "1"
fnv = "1.0.5"
futures-core = { version = "0.3", default-features = false }
futures-io = "0.3"
futures-sink = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["io"] }
http = "1.1"
indexmap = { version = "2", features = ["std"] }
slab = "0.4.2"
tracing = { version = "0.1.35", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = { workspace = true }
env_logger = { version = "0.11", default-features = false }
hex = "0.4.3"
nuclei = { workspace = true }
quickcheck = { version = "1.0.3", default-features = false }
rand = "0.8.4"
serde = "1.0.0"
serde_json = "1.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package]
name = "afterburner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Afterburner core — engine traits, types, cache registry"

[features]
default = []
# Expose HostFunction::HttpRequest / HostContext::http_request. Off by
# default so hosts that only need Log/GetEnv don't carry HTTP types.
host-http = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
blake3.workspace = true
thiserror.workspace = true
kovan-map.workspace = true
kovan-channel.workspace = true
fastrace.workspace = true

# Linux-only: setpriority/sched_setaffinity for ThreadGovernance.
# Gated by target_os cfg so non-Linux builds skip entirely (governance
# on those platforms fails loud in pure Rust, no libc call involved).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[package]
name = "afterburner-wasi-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# Apache-2.0 WITH LLVM-exception, NOT the workspace BSL: this crate is
# derived from wasmtime-wasi 49.0.4 (see NOTICE and LICENSE).
license = "Apache-2.0 WITH LLVM-exception"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "WASI host for Afterburner on nuclei, derived from wasmtime-wasi"
keywords = ["webassembly", "wasm", "wasi", "nuclei"]
categories = ["wasm"]
readme = "README.md"
include = ["src/**/*", "witx/**/*", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["p1", "p2", "p3"]
p0 = ["p1"]
p1 = ["dep:wiggle", "p2"]
p2 = ["wasmtime/component-model", "wasmtime/async"]
p3 = ["wasmtime/component-model-async", "wasmtime/component-model-bytes"]

[dependencies]
async-trait = "0.1.89"
bitflags = "2.9.4"
bytes = { version = "1.11.1", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
nuclei = { workspace = true }
public-cap-primitives = { package = "cap-primitives", version = "4.0.3" }
rand = { version = "0.10.1", default-features = false, features = ["std_rng", "thread_rng"] }
thiserror = "2.0.17"
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
url = "2.5.7"
wasmtime = { version = "49", default-features = false, features = ["runtime", "std"] }
wasmtime-wasi-io = { version = "49", default-features = false, features = ["std"] }
wiggle = { version = "49", default-features = false, features = ["wasmtime"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "net"] }
rustix-linux-procfs = "0.1.1"

[target.'cfg(windows)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "net"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Performance",
] }
winx = "0.36.0"

[dev-dependencies]
env_logger = "0.11.5"
tempfile = "3.27.0"
test-log = { version = "0.2.18", default-features = false, features = ["trace"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
wasmtime = { version = "49", default-features = false, features = ["default", "incremental-cache"] }

[lints.clippy]
allow_attributes_without_reason = "warn"
clone_on_copy = "warn"
extra_unused_type_parameters = "warn"
from_over_into = "warn"
manual_strip = "warn"
map_clone = "warn"
multiple_bound_locations = "warn"
redundant_field_names = "warn"
uninlined_format_args = "warn"
unnecessary_cast = "warn"
unnecessary_fallible_conversions = "warn"
unnecessary_mut_passed = "warn"
unnecessary_to_owned = "warn"
useless_conversion = "warn"

[lints.clippy.all]
level = "allow"
priority = -1

[lints.rust]
trivial_numeric_casts = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(pulley_tail_calls)",
    "cfg(pulley_assume_llvm_makes_tail_calls)",
    "cfg(pulley_disable_interp_simd)",
    "cfg(arc_try_new)",
    "cfg(fuzzing)",
    "cfg(gc_zeal)",
]

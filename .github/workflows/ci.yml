name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# A new push to the same branch (or a fresh PR commit) cancels any
# earlier in-progress run for that branch / PR. Saves runner minutes
# and keeps the actions tab focused on what's current.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `--test-threads=1` is the CI contract (see .cargo/config.toml).
  # Many integration tests spawn long-lived `burn` subprocesses; running
  # them in parallel oversubscribes CPU and flakes timing assertions.
  RUST_TEST_THREADS: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ''
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          target: wasm32-wasip1
          rustflags: ''
      - name: Install libclang (rquickjs-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: Swatinem/rust-cache@v2
      - name: Install Binaryen v130 (wasm-opt for release-cli embed)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz \
            | tar xz -C /tmp
          echo "/tmp/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - name: clippy (workspace, default features)
        # Exclude afterburner-plugin: it targets wasm32-wasip1 only and
        # can't compile on the host triple (no_std, no panic_handler).
        run: cargo clippy --workspace --exclude afterburner-plugin --all-targets -- -D warnings
      - name: clippy (afterburner with release-cli features)
        run: cargo clippy -p afterburner --all-targets --features release-cli -- -D warnings
      - name: clippy (afb + cloud package crates)
        run: cargo clippy -p afterburner-afb -p afterburner-cloud --all-targets -- -D warnings

  # ---------------------------------------------------------------
  # afterburner-wasi: build-once, shard-many.
  #
  # build-wasi-tests  -- compile the test binary and archive it (nextest
  #                      .tar.zst). May exceed 10 min (it is the build,
  #                      not a test run).
  # test-wasi         -- 6 parallel shards, each <=10 min wall-clock.
  #                      RUST_TEST_THREADS=1 (global env) keeps tests
  #                      serial within each shard; the 6 shards run as
  #                      independent CI jobs -> parallelism without
  #                      subprocess-flake risk.
  # test-wasi-pyodide -- #[ignore]'d pyodide_integration tests behind a
  #                      prepared /tmp/pyodide-exnref.wasm artifact.
  #                      The tests skip-with-a-message when the wasm is
  #                      absent, so a fetch failure is non-fatal.
  #
  # Branch-protection note: if the old required check "test / lib-wasi"
  # is listed in repository Settings -> Branches, replace it with
  # "test / wasi (shard 1/6)" ... "test / wasi (shard 6/6)".
  # ---------------------------------------------------------------
  build-wasi-tests:
    name: build / wasi-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasi-archive
      - name: nextest archive (afterburner-wasi)
        run: cargo nextest archive -p afterburner-wasi --archive-file ${{ runner.temp }}/nextest-wasi.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-wasi-archive
          path: ${{ runner.temp }}/nextest-wasi.tar.zst
          retention-days: 1

  test-wasi:
    name: test / wasi (shard ${{ matrix.shard }}/6)
    needs: build-wasi-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Archive-run needs the source tree (for --workspace-remap) and a
      # toolchain (cargo drives nextest); the binaries come from the archive,
      # so nothing is recompiled here.
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - uses: actions/download-artifact@v4
        with:
          name: nextest-wasi-archive
          path: ${{ runner.temp }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: nextest run (shard ${{ matrix.shard }}/6)
        run: >-
          cargo nextest run
          --archive-file ${{ runner.temp }}/nextest-wasi.tar.zst
          --workspace-remap .
          --partition count:${{ matrix.shard }}/6
          --no-fail-fast

  test-wasi-pyodide:
    name: test / wasi-pyodide
    needs: build-wasi-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - uses: actions/download-artifact@v4
        with:
          name: nextest-wasi-archive
          path: ${{ runner.temp }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install Binaryen v130 (wasm-opt --translate-to-exnref)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz \
            | tar xz -C /tmp
          echo "/tmp/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - name: Get wasm-opt version for cache key
        id: wasm_opt_ver
        run: echo "ver=$(wasm-opt --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache pyodide-exnref.wasm
        id: pyodide_cache
        uses: actions/cache@v4
        with:
          path: /tmp/pyodide-exnref.wasm
          key: pyodide-exnref-0.28.3-${{ steps.wasm_opt_ver.outputs.ver }}
      - name: Fetch and translate Pyodide artifacts
        if: steps.pyodide_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Download Pyodide 0.28.3 core artifacts from the CDN.
          base="https://cdn.jsdelivr.net/pyodide/v0.28.3/full"
          curl -fsSL "$base/pyodide.asm.wasm" -o /tmp/pyodide-new.asm.wasm
          curl -fsSL "$base/python_stdlib.zip" -o /tmp/python_stdlib.zip
          # Translate legacy EH (try/catch) to exnref (try_table) so Cranelift
          # can compile the binary.  wasm-opt v130 supports --translate-to-exnref.
          wasm-opt --translate-to-exnref \
            --enable-exception-handling --enable-reference-types \
            --enable-bulk-memory --enable-simd --enable-sign-ext \
            --enable-nontrapping-float-to-int --enable-mutable-globals \
            /tmp/pyodide-new.asm.wasm -o /tmp/pyodide-exnref.wasm
      - name: nextest run (pyodide integration, ignored-only)
        # Tests skip via eprintln+return when /tmp/pyodide-exnref.wasm is absent.
        # A fetch failure is therefore non-fatal: the tests emit a SKIP message
        # and the shard exits 0.  Prefer the test-level skip over continue-on-error.
        run: >-
          cargo nextest run
          --archive-file ${{ runner.temp }}/nextest-wasi.tar.zst
          --workspace-remap .
          --run-ignored ignored-only
          -E 'test(/pyodide|integration/)'
          --no-fail-fast

  test-lib-compat:
    name: test / lib-compat
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: lib-compat
      - name: cargo test (node-compat + ignite + plugin, default features)
        run: cargo test -p afterburner-node-compat -p afterburner-ignite -p afterburner-plugin --no-fail-fast -- --test-threads=1

  test-lib-engine:
    name: test / lib-engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: lib-engine
      - name: cargo test (afterburner + core + flow + adaptive + thrust, default features)
        run: cargo test --workspace --exclude afterburner-wasi --exclude afterburner-afb --exclude afterburner-cloud --exclude afterburner-node-compat --exclude afterburner-ignite --exclude afterburner-plugin --no-fail-fast -- --test-threads=1

  # Pure host-only package crates: the `.afb` format and the registry
  # client. No wasm target, libclang, or 8 MB plugin cold-start — fast,
  # isolated coverage so a failure points straight at one of these crates.
  test-pkg-crates:
    name: test / pkg-crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          key: pkg-crates
      - name: cargo test (afterburner-afb + afterburner-cloud)
        run: cargo test -p afterburner-afb -p afterburner-cloud --all-targets --no-fail-fast -- --test-threads=1

  # ---------------------------------------------------------------
  # CLI architectural matrix.
  # Each tier is one independent layer of the `burn` runtime; tests
  # within a tier share polyfills + host code, so a tier-scoped
  # failure points to one subsystem instead of being lost in a
  # 6-hour serial monolith.
  # ---------------------------------------------------------------
  test-cli:
    name: test / ${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CLI scaffolding: argv/env, mode dispatch, shebang, callsites,
          # cli-vs-library parity. Smallest subprocess cost per test.
          - tier: cli-entry
            features: 'bin'
            tests: >-
              --test b0_check
              --test b0_cli_vs_library
              --test b0_process_argv_env
              --test b0_script_mode
              --test b_cli_parity
              --test b_shebang
              --test b_callsite_api
              --test b_module_internals
              --test b_process_getters
              --test b_process_stdio
              --test b_process_report
              --test b_process_lifecycle
              --test b_npm_prereqs
              --test b_pkg_dev
              --lib
            timeout: 40

          # Module resolution + TS strip + ESM pipeline. Only tier that
          # needs `ts` (oxc adds ~3 MiB to the binary so isolate the cost).
          - tier: cli-modules-ts
            features: 'bin ts'
            tests: >-
              --test b1_require_resolution
              --test b6_require_resolution
              --test b8_typescript
              --test b9_esm
              --test b_sourcemaps
            timeout: 40

          # Daemon lifecycle + multi-shard pool — the historically
          # flakiest tier (b_shard_pool's wait_for_listening cluster).
          # 55-min timeout absorbs cold-start variance on GH 4-vCPU.
          - tier: cli-daemon-core
            features: 'bin'
            tests: >-
              --test b2_http_server
              --test b2b_multiplex
              --test b3_daemon_lifecycle
              --test b_shard_pool
              --test b_cluster_multiproc
              --test b_daemon_init_bytecode
              --test b4_passthrough
              --test b5_shim
            timeout: 55

          # Full network protocol stack split into two parallel jobs.
          # `http3` brings in QUIC; both halves need the feature.
          - tier: cli-network-a
            features: 'bin http3'
            tests: >-
              --test b7_dgram
              --test b7_dns
              --test b7_net
              --test b7_net_security
              --test b7_tls
              --test b7_tls_security
              --test b_http2_client
              --test b_http2_server
              --test b_http3_quic
            timeout: 40

          - tier: cli-network-b
            features: 'bin http3'
            tests: >-
              --test b_websocket
              --test b_eventsource
              --test b_tls_check_server_identity
              --test b_tls_defaults
              --test b_async_outbound_http
              --test b_request_fields
              --test b_dns_resolveany_execfilesync
              --test b_http_header_validators
              --test b_fetch_extras
            timeout: 40

          # Node compat I/O layer: fs / streams / buffer / events / zlib.
          # Split into two parallel jobs; shared fs_host + stream
          # polyfills -- failures in either half localize to this layer.
          - tier: cli-node-io-a
            features: 'bin'
            tests: >-
              --test b_fs_classes
              --test b_fs_promises_expansion
              --test b_stream_dual_shape
              --test b_stream_static_probes
              --test b_buffer_extras
              --test b_buffer_isutf8_test_mock
              --test b_events_add_abort_listener
            timeout: 35

          - tier: cli-node-io-b
            features: 'bin'
            tests: >-
              --test b_events_buffer_stream_extras
              --test b_zlib_brotli
              --test b_zlib_process_fs_extras
              --test b_zlib_streaming
              --test b_uint8array_codec
              --test b_filereader_sqlite_constants
            timeout: 35

          # Node compat runtime: globals / util / intl / iterators /
          # web globals / performance / process-level.
          # Split into three parallel jobs (was one 90-min entry).
          # b_node_test_runner (~10m) moved to runtime-b to keep
          # runtime-a under 26m (was killed at 35m in run 27888012472).
          - tier: cli-node-runtime-a
            features: 'bin'
            tests: >-
              --test b_node26_extras
              --test b_node26_surface
              --test b_node_compat_round2
              --test b_node_compat_round3
              --test b_node_surface_round4
              --test b_intl_and_clone
              --test b_iterator_helpers
              --test b_async_iterator_global
              --test b_scheduler_dispose_stack
            timeout: 45

          - tier: cli-node-runtime-b
            features: 'bin'
            tests: >-
              --test b_node_test_runner
              --test b_symbol_dispose
              --test b_blob_url
              --test b_random_bytes_inspect_custom
              --test b_json_rawjson_readline
              --test b_util_system_errors_callsites_diff
              --test b_request_response_bytes_crypto_globals
              --test b_web_globals
              --test b_web_streams
              --test b_performance_observer
              --test b_performance_user_timing
            timeout: 45

          - tier: cli-node-runtime-c
            features: 'bin'
            tests: >-
              --test b_os_dirs
              --test b_os_timers_extras
              --test b_v8_serialize_compat
              --test b_abort_signal_any
              --test b_atomics
              --test b_async_hooks_real
              --test b_async_hooks_await
              --test b_vm_module_records
              --test b_vm_measure_worker_untransferable
            timeout: 45

          # WASM loader + node:vm + cross-process atomics.
          # Shares the wasm-loader host code; failures here implicate
          # the wasmtime layer (rare since plugin is pre-Wizered).
          - tier: cli-wasm-vm
            features: 'bin'
            tests: >-
              --test b_wasm_loader
              --test b_wasm_memory_grow
              --test b_wasm_extras
              --test b_atomics_wait_async
              --test b_atomics_wait_xprocess
              --test b_vm_module_cycles
            timeout: 30

          # webcrypto + subtle. Independent polyfill surface — isolated
          # so `aes` / `ring` / `sha2` bumps validate against just this
          # tier.
          - tier: cli-crypto
            features: 'bin'
            tests: >-
              --test b_crypto_extras
              --test b_crypto_extras_round5
              --test b_crypto_random_extras
              --test b_crypto_stream_extras
              --test b_subtle_crypto
              --test b_subtle_full
            timeout: 40

          # child_process spawn + worker_threads + sandbox boundary.
          # Tests here spawn nested subprocesses (subprocess-of-
          # subprocess), so isolate the resource pressure.
          - tier: cli-process-child
            features: 'bin'
            tests: >-
              --test b_child_process_async
              --test b10_security
              --test b10_worker_threads
            timeout: 40

          # CDP / inspector / debugger handshake. The slowest cold-
          # start (debugger negotiation); isolated so flakes here
          # don't tax shared tiers.
          - tier: cli-inspector
            features: 'bin'
            tests: >-
              --test b_inspector_cdp
              --test b_debugger_breakpoint
            timeout: 40

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.tier }}
      - name: cargo test (${{ matrix.tier }})
        run: |
          cargo test -p afterburner \
            --features "${{ matrix.features }}" \
            ${{ matrix.tests }} \
            --no-fail-fast -- --test-threads=1

  # ---------------------------------------------------------------
  # Shadow integration matrix.
  # Each shadow pulls its own native dep (rusqlite / image+
  # fast_image_resize / bcrypt / argon2 / jsonwebtoken). Fully
  # independent build caches keep dependabot bumps from cascading.
  # ---------------------------------------------------------------
  test-cli-shadows:
    name: test / cli-shadows-${{ matrix.shadow }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shadow: bcrypt
            timeout: 20
          - shadow: argon2
            timeout: 20
          - shadow: jsonwebtoken
            timeout: 20
          - shadow: sqlite3
            timeout: 45
          - shadow: sharp
            timeout: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: shadow-${{ matrix.shadow }}
      - name: cargo test (shadow-${{ matrix.shadow }})
        run: |
          cargo test -p afterburner \
            --features "bin ts shadow-${{ matrix.shadow }}" \
            --test b_shadow_${{ matrix.shadow }} \
            --no-fail-fast -- --test-threads=1

  # ---------------------------------------------------------------
  # npm install end-to-end (LIVE npm registry).
  # b_npm_install_e2e is #[ignore]'d so it stays out of the default
  # offline `cargo test` (the other tiers must run with no network).
  # But `burn npm install` is load-bearing and its only coverage is
  # these tests — when the daemon event loop stopped emitting the
  # process 'exit' lifecycle, npm silently produced no output and
  # installed nothing, and NO CI job could see it. This job runs the
  # ignored tests explicitly with `--ignored` against the real
  # registry so that class of regression fails CI. Needs node/npm on
  # PATH: `burn npm` execs the real npm, which re-enters burn through
  # the `node` PATH shim.
  # ---------------------------------------------------------------
  test-npm-e2e:
    name: test / npm-install-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          key: npm-e2e
      - name: cargo test (npm install e2e, live registry)
        run: |
          cargo test -p afterburner \
            --features "bin ts" \
            --test b_npm_install_e2e \
            --no-fail-fast -- --ignored --test-threads=1

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no deps)
        # Don't gate CI on broken intra-doc links — they're warnings
        # not generation failures. Plugin excluded since it builds
        # for wasm32-wasip1 only.
        run: cargo doc --workspace --exclude afterburner-plugin --no-deps

  plugin-rebuild:
    name: plugin .wasm reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ''
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - name: Install Binaryen (wasm-opt)
        # 129 ships the `--llvm-memory-copy-fill-lowering` and
        # `--llvm-nontrapping-fptoint-lowering` flags that the plugin
        # build needs to lower modern WASM features for javy 8.1.1's
        # bundled validator. 119 was too old.
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz \
            | tar xz -C /tmp
          echo "/tmp/binaryen-version_129/bin" >> "$GITHUB_PATH"
      - name: Install javy
        run: |
          curl -sSL https://github.com/bytecodealliance/javy/releases/download/v8.1.1/javy-x86_64-linux-v8.1.1.gz \
            | gunzip > /tmp/javy
          chmod +x /tmp/javy
          sudo mv /tmp/javy /usr/local/bin/javy
      - uses: Swatinem/rust-cache@v2
      - name: Rebuild plugin and verify checksum matches
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir=crates/afterburner-wasi/plugin
          # Stash the current artifact + sha
          cp "$plugin_dir/afterburner_plugin.wasm" /tmp/expected.wasm
          cp "$plugin_dir/afterburner_plugin.wasm.bundle-sha256" /tmp/expected.sha
          bash crates/afterburner-plugin/build.sh
          # The wizer pre-init step is non-deterministic on metadata
          # (timestamps embedded in custom sections). We compare the
          # *bundle* (polyfills/plenum) sha which build.sh writes to
          # the .bundle-sha256 sidecar — that's content-addressed.
          diff -u /tmp/expected.sha "$plugin_dir/afterburner_plugin.wasm.bundle-sha256"

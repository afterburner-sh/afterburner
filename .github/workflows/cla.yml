# CLA Assistant (Lite) — every external PR must have a signed CLA.
#
# How it works: on each PR (and on "I have read the CLA Document and I
# hereby sign the CLA" comments) the contributor-assistant action checks
# the signature ledger committed on the `cla-signatures` branch of THIS
# repo. Unsigned contributors get a comment asking them to sign by
# replying with that sentence; once signed, the ledger remembers them
# forever — no re-signing on later PRs. The PR status check stays red
# until every commit author in the PR has signed.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write       # write the signature ledger on the cla-signatures branch
  pull-requests: write  # comment + set the PR status
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Run on PR events, and only on the sign/recheck comments (not every comment).
    if: >
      (github.event_name == 'pull_request_target') ||
      (github.event.comment.body == 'recheck' ||
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Ledger of who has signed — committed to a dedicated branch of
          # this repo, so it survives forks and needs no external storage.
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          # The CLA contributors agree to.
          path-to-document: 'https://github.com/afterburner-sh/afterburner/blob/master/CLA.md'
          # Maintainers and bots are exempt - the CLA gates external PRs.
          allowlist: vertexclique,dependabot[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✓'

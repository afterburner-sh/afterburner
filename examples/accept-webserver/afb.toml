[format]
version = "1.0"

[package]
name = "accept-webserver"
namespace = "examples"
version = "0.1.0"
language = "python"
entry = "source/main.py"

[runtime]
min = "0.1.0"

# Section 15 acceptance webserver. Uses Python's built-in http.server (stdlib,
# no pip wheel needed) with a hand-rolled ThreadingHTTPServer that exercises the
# N1 socket shims (DaemonNet bind/listen/accept) and N2 thread shims
# (DaemonWorkers / pthread_create). The [pip] declaration below is the
# scaffolded form showing where a real framework (e.g. flask = ">=3,<4") would
# go once the pip vendor phase (plan section 13) ships; for now it is commented
# out because the vendor resolve step is not yet implemented.
#
# vertexia: pip vendor (section 13 PA-PD) is deferred; declare the framework
# here as a comment so the upgrade path is obvious. Switch to:
#   [pip]
#   flask = ">=3,<4"
# and replace main.py with a Flask app once section 13 ships.
